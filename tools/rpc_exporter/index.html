<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Valheim RPC Method Table Exporter</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>

<h2>Valheim RPC Method Hash Table Generator</h2>

<div id="dropZone">
    <p id="dropText">Drag files or folders here</p>
    <p>— or —</p>
    <button id="browseBtn">Browse for file(s) / folder</button>
    <input type="file" id="fileInput" multiple webkitdirectory hidden>
</div>

<br>

<div class="center">
    <button id="processBtn" disabled>Export method table</button>
</div>

<h3 id="outputTitle" style="display: none;">Output</h3>

<div id="outputSection" class="outputContainer" style="display: none;">
    <textarea id="outputBox"></textarea>

    <button id="copyBtn" title="Copy to clipboard" aria-label="Copy">
        <svg xmlns="http://www.w3.org/2000/svg"
             width="16"
             height="16"
             fill="currentColor"
             viewBox="0 0 16 16">
          <path fill-rule="evenodd"
            d="M4 2a2 2 0 0 1 2-2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2zm2-1a1 1 0 0 0-1 1v8a1 1 0 0 0 1 1h8a1 1 0 0 0 1-1V2a1 1 0 0 0-1-1zM2 5a1 1 0 0 0-1 1v8a1 1 0 0 0 1 1h8a1 1 0 0 0 1-1v-1h1v1a2 2 0 0 1-2 2H2a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h1v1z"/>
        </svg>
    </button>
</div>

<script src="script.js"></script>
</body>
</html>
